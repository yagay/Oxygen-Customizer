name: Make Beta Release

on:
  push:
    branches:
      - beta
    paths:
      - '.github/edit2MakeNewBeta'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout beta source
        uses: actions/checkout@v4
        with:
          ref: beta
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Shell script permissions
        run: chmod +x .github/*.sh gradlew

      - name: Require release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Release signing secrets are required."
            exit 1
          fi
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "storeFile=${{ github.workspace }}/key.jks"
          } > keystore.properties
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "${{ github.workspace }}/key.jks"

      - name: Generate changelog
        run: .github/extractChanges.sh

      - name: Bump version
        run: .github/bumpVersion.sh ${{ github.run_id }}

      - name: Build signed release
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: OxygenCustomizer
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish beta release
        uses: ncipollo/release-action@v1.14.0
        with:
          tag: ${{ env.VTag }}
          name: ${{ env.VName }}
          body: ${{ env.TMessage }}
          prerelease: true
          allowUpdates: false
          draft: false
          artifacts: app/build/outputs/apk/release/*.apk

      - name: Commit version bump
        uses: github-actions-x/commit@v2.9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push-branch: beta
          commit-message: 'Version update: Beta Release'
          force-add: 'true'
          files: app/build.gradle.kts BetaChangelog.md latestBeta.json
          name: GitHub
          email: OxygenCustomizer@dhd.it

      - name: Telegram primary channel
        env:
          TELEGRAM_TK: ${{ secrets.TELEGRAM_TK }}
          CHAT_ID: ${{ secrets.OC_CHANNEL }}
        run: |
          if [ -z "$TELEGRAM_TK" ] || [ -z "$CHAT_ID" ]; then
            echo "Primary Telegram channel is not configured; skipping."
            exit 0
          fi
          TEXT=$(cat telegram.msg)
          curl -fsS -X POST "https://api.telegram.org/bot$TELEGRAM_TK/sendMessage"             -d "chat_id=$CHAT_ID"             --data-urlencode "text=$TEXT"             -d "parse_mode=Markdown"             -d "disable_web_page_preview=true"

      - name: Telegram secondary channel
        env:
          TELEGRAM_TK: ${{ secrets.TELEGRAM_TK }}
          CHAT_ID: ${{ secrets.OC_CHANNEL2 }}
        run: |
          if [ -z "$TELEGRAM_TK" ] || [ -z "$CHAT_ID" ]; then
            echo "Secondary Telegram channel is not configured; skipping."
            exit 0
          fi
          TEXT=$(cat telegram.msg)
          curl -fsS -X POST "https://api.telegram.org/bot$TELEGRAM_TK/sendMessage"             -d "chat_id=$CHAT_ID"             --data-urlencode "text=$TEXT"             -d "parse_mode=Markdown"             -d "disable_web_page_preview=true"
