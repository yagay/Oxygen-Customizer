name: Make Beta Release

on:
  push:
    branches:
      - 'beta'
    paths:
      - '.github/edit2MakeNewBeta'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Source Code Checkout
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@v4.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Shell Scripts Permissions
        run: chmod +x .github/*.sh

      - name: Changelog Generation
        run: .github/extractChanges.sh

      - name: Version Bump
        run: .github/bumpVersion.sh ${{ github.run_id }}

      - name: Gradlew Permissions
        run: chmod +x gradlew

      - name: Validate signing secrets
        run: |
          test -n "${{ secrets.KEYSTORE }}" || { echo "Missing KEYSTORE secret"; exit 1; }
          test -n "${{ secrets.KEYSTORE_PASSWORD }}" || { echo "Missing KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "${{ secrets.KEY_ALIAS }}" || { echo "Missing KEY_ALIAS secret"; exit 1; }
          test -n "${{ secrets.KEY_PASSWORD }}" || { echo "Missing KEY_PASSWORD secret"; exit 1; }

      - name: Signature files preparation
        run: |
          if [ ! -z "${{ secrets.KEYSTORE }}" ]; then
            echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> keystore.properties
            echo keyAlias='${{ secrets.KEY_ALIAS }}' >> keystore.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> keystore.properties
            echo storeFile='${{ github.workspace }}/key.jks' >> keystore.properties
            echo ${{ secrets.KEYSTORE }} | base64 --decode > ${{ github.workspace }}/key.jks
          fi

      - name: Gradle Build
        run: ./gradlew assembleRelease

      - name: Record APK SHA-256
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          test -n "$APK_PATH"
          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os
          path = "latestBeta.json"
          with open(path, "r", encoding="utf-8") as fh:
              data = json.load(fh)
          data["sha256"] = os.environ["APK_SHA256"]
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(data, fh, indent=2)
              fh.write("\n")
          PY

      - name: Upload Xposed Artifact to Actions
        uses: actions/upload-artifact@v4.3.1
        with:
          name: OxygenCustomizer
          path: app/build/outputs/apk/release/*.apk

      - name: Oxygen Customizer Binary Release
        uses: ncipollo/release-action@v1.14.0
        with:
          tag: ${{ env.VTag }}
          name: ${{ env.VName }}
          body: ${{ env.TMessage }}
          prerelease: true
          allowUpdates: false
          draft: false
          artifacts: 'app/build/outputs/apk/release/*.apk'

      - name: Version Bump Commit
        uses: github-actions-x/commit@v2.9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push-branch: 'beta'
          commit-message: 'Version update: Beta Release'
          force-add: 'true'
          files: app/build.gradle.kts BetaChangelog.md latestBeta.json
          name: GitHub
          email: actions@yagay.local

      - name: Telegram Channel Post
        run: |
          curl -X POST \
            -H 'Content-Type: application/json' \
            -d '{"chat_id": ${{ secrets.OC_CHANNEL }}, "text": "'"$(cat telegram.msg)"'", "parse_mode": "Markdown", "reply_markup": {"inline_keyboard": [[{"text":"Download", "url": "https://www.github.com/yagay/Oxygen-Customizer/releases/download/${{ env.VTag }}/OxygenCustomizer.apk"}]]}' https://api.telegram.org/bot${{ secrets.TELEGRAM_TK }}/sendMessage

      - name: Telegram Channel Post
        run: |
          curl -X POST \
            -H 'Content-Type: application/json' \
            -d '{"chat_id": ${{ secrets.OC_CHANNEL2 }}, "text": "'"$(cat telegram.msg)"'", "parse_mode": "Markdown", "reply_markup": {"inline_keyboard": [[{"text":"Download", "url": "https://www.github.com/yagay/Oxygen-Customizer/releases/download/${{ env.VTag }}/OxygenCustomizer.apk"}]]}' https://api.telegram.org/bot${{ secrets.TELEGRAM_TK }}/sendMessage