name: Build Nightly APK

on:
  push:
    branches:
      - beta
      - 'fix/**'
  pull_request:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read application version
        run: |
          VERSION_CODE=$(grep -m1 'versionCode =' app/build.gradle.kts | awk '{print $3}' | tr -d '\r')
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=nightly-$VERSION_CODE" >> "$GITHUB_ENV"
          echo "NIGHTLY_VERSION=nightly-$VERSION_CODE Dev (#${{ github.run_number }})" >> "$GITHUB_ENV"

      - name: Set nightly version name
        uses: chkfung/android-version-actions@v1.2.3
        with:
          gradlePath: app/build.gradle.kts
          versionName: "${{ env.VERSION_NAME }} (#${{ github.run_number }})"

      - name: Prepare release signing
        id: signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
              echo "storeFile=${{ github.workspace }}/key.jks"
            } > keystore.properties
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "${{ github.workspace }}/key.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build signed release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta' && steps.signing.outputs.available == 'true'
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: "Oxygen Customizer ${{ env.VERSION_NAME }} Dev (#${{ github.run_number }}) Debug"
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta' && steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: "Oxygen Customizer ${{ env.VERSION_NAME }} Dev (#${{ github.run_number }})"
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Update nightly metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        run: |
          git reset --hard
          git clean -fdx
          git fetch origin nightly-versioning
          git checkout nightly-versioning
          sed -i "s/\"version\":.*/\"version\": \"$NIGHTLY_VERSION\",/" latestNightly.json
          sed -i "s/\"versionCode\":.*/\"versionCode\": $VERSION_CODE,/" latestNightly.json
          sed -i "s/\"devBuild\":.*/\"devBuild\": ${{ github.run_number }},/" latestNightly.json
          sed -i "s/\"actionRun\":.*/\"actionRun\": ${{ github.run_id }},/" latestNightly.json
          sed -i "s#\"actionLink\":.*#\"actionLink\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"#" latestNightly.json

      - name: Commit nightly metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        uses: github-actions-x/commit@v2.9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push-branch: nightly-versioning
          commit-message: Update nightly version
          force-add: 'true'
          files: latestNightly.json
          name: GitHub
          email: OxygenCustomizer@dhd.it
