name: Build Nightly Debug (arm64)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Compile arm64 Debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check upstream integration invariants
        run: python3 scripts/check_upstream_merge.py

      - name: Check runtime hardening invariants
        run: python3 scripts/check_runtime_hardening.py

      - name: Build arm64 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PciArm64Only=true assembleDebug

      - name: Verify arm64 and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          ABIS="$(unzip -Z1 "$APK" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)"
          if [ -n "$ABIS" ] && [ "$ABIS" != "arm64-v8a" ]; then
            echo "::error::Unexpected APK ABIs: $ABIS"
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK" artifacts/OxygenCustomizer-debug-arm64-v8a.apk

      - name: Upload arm64 Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: OxygenCustomizer-debug-arm64-v8a
          path: artifacts/OxygenCustomizer-debug-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
