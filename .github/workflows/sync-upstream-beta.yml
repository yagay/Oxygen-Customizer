name: One-time upstream beta merge
on:
  push:
    branches:
      - sync/upstream-beta-20261011

permissions:
  contents: write

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream beta, preserving local conflicts and CI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/DHD2280/Oxygen-Customizer.git
          git fetch --no-tags upstream beta
          echo "Upstream commit: $(git rev-parse upstream/beta)"
          if git merge-base --is-ancestor upstream/beta HEAD; then
            echo "Upstream beta is already merged"
            exit 0
          fi
          git merge --no-ff --no-commit -X ours upstream/beta
          # GITHUB_TOKEN cannot update workflow files; keep the fork's CI unchanged.
          git restore --source=HEAD --staged --worktree -- .github/workflows
          if [ -n "$(git ls-files --unmerged)" ]; then
            echo "Unresolved conflicts remain" >&2
            exit 1
          fi
          git commit -m "Merge DHD2280/Oxygen-Customizer beta (2026-10-11), preserve fork CI"
          git merge-base --is-ancestor upstream/beta HEAD
          git push origin HEAD:sync/upstream-beta-20261011
